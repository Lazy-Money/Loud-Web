[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loudvox-desktop"
version = "0.1.0"
description = "Cliente de escritorio LoudVox: hotkeys globales, lectura de selección y archivos."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    # Versiones fijadas: se sabe exactamente qué código corre.
    "pynput==1.8.2",
    "pyperclip==1.11.0",
    "pypdf==6.14.2",
    # Bandeja del sistema
    "pystray==0.19.5",
    "pillow>=10,<13",
    # Dictado (voz -> texto, 100% local)
    "sounddevice==0.5.5",
    "faster-whisper==1.2.1",
    # Fijado en 4.4.0: es la última serie que usa cuDNN 8 + CUDA 12, el
    # mismo set de DLLs que traen las builds de Purfview/Subtitle Edit,
    # permitiendo reutilizarlas para GPU sin descargar nada.
    "ctranslate2==4.4.0",
    # Visor de documentos (ventana nativa que envuelve HTML/JS local)
    "pywebview==6.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
loudvox-desktop = "loudvox_desktop.cli:main"
loudvox-viewer = "loudvox_desktop.viewer.app:main"

[tool.setuptools.packages.find]
include = ["loudvox_desktop*"]

[tool.setuptools.package-data]
"loudvox_desktop.viewer" = ["ui/*"]
"loudvox_desktop.assets" = ["*.ico", "*.png"]
